<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved theme (or the device preference) before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        var dark;
        try {
          var saved = localStorage.getItem("portfolio-theme");
          dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        var root = document.documentElement;
        if (dark) root.classList.add("dark");
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <title>Junriel Pajal | Automation Specialist | CRM, Funnels & Workflow Automation</title>
    <meta name="description" content="I build systems that run your business on autopilot. Custom CRM setups, sales funnels, and workflow automations using GoHighLevel, Zapier, and n8n." />
    <meta name="author" content="Junriel Pajal" />
    <meta property="og:title" content="Junriel Pajal | Automation Specialist" />
    <meta property="og:description" content="Custom CRM setups, sales funnels, and workflow automations that run your business on autopilot." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
    <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
  </head>

  <body>
    <!-- Static copy of the Contact form so Netlify Forms can detect it at build time. Field names must match src/components/Contact.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
